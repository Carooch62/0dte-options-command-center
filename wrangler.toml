name = "0dte-options-command-center"
main = "worker.js"
compatibility_date = "2026-09-28"

[build]
command = "node scripts/build-assets.mjs"

[assets]
directory = "public"
binding = "ASSETS"

run_worker_first = ["/data/*", "/refresh", "/health", "/private/*"]

# UTC window covers both EST and EDT; handler checks New York session hours.
[triggers]
crons = ["* 13-20 * * MON-FRI"]

[[durable_objects.bindings]]
name = "SCAN_COORDINATOR"
class_name = "ScanCoordinator"

[[migrations]]
tag = "scan-coordinator-v1"
new_sqlite_classes = ["ScanCoordinator"]

# Resource identifier only; credentials remain Worker secrets.
[[kv_namespaces]]
binding = "PLAID_STORE"
id = "c141007029b0432abe871df0e27c3bdf"

[vars]
ROBINHOOD_FILL_LOOKUP_ENABLED = "false"
FAST_SCAN_ENABLED = "false"
ROBINHOOD_UNATTENDED_CONFIRMED = "true"
WATCH_QUOTE_PILOT_ENABLED = "true"
WATCH_VERIFIED_ALERTS_ENABLED = "false"

# Branch previews intentionally have no brokerage storage or private connection.
# Never copy the production PLAID_STORE ID into this block.
[previews]
kv_namespaces = []

[previews.vars]
APP_ENV = "preview"


[[durable_objects.bindings]]
name = "ROBINHOOD_COORDINATOR"
class_name = "RobinhoodCoordinator"

[[migrations]]
tag = "robinhood-coordinator-v1"
new_sqlite_classes = ["RobinhoodCoordinator"]

