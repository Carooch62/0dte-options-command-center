name = "0dte-options-command-center"
main = "worker.js"
compatibility_date = "2026-09-28"

[build]
command = "node scripts/build-assets.mjs"

[assets]
directory = "public"
binding = "ASSETS"

run_worker_first = ["/data/*", "/refresh", "/health", "/private/*"]

# UTC window covers both EST and EDT; handler checks New York session hours.
[triggers]
crons = ["1-59/5 13-20 * * MON-FRI"]

# Resource identifier only; credentials remain Worker secrets.
[[kv_namespaces]]
binding = "PLAID_STORE"
id = "c141007029b0432abe871df0e27c3bdf"

# Branch previews serve public assets without production brokerage storage.
# Assets stay top-level; private integrations require separate test resources.
[previews]
kv_namespaces = []
