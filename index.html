<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0DTE Options Command Center</title><style>html,body{margin:0;background:#070a10;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%}main{height:100%;display:grid;place-items:center;text-align:center}.box{padding:24px}.muted{color:#8f9bad}a{color:#66b7ff}.gate{max-width:650px;margin:20px;padding:20px;border:1px solid #293648;border-radius:14px;background:#101722}</style></head><body><main><div class="box"><h1>0DTE Options Command Center</h1><div id="gate" class="gate"><div class="muted">Checking market session…</div></div><p><a href="./dashboard_v2.html">Open full dashboard</a></p></div></main><script>async function boot(){try{const d=await fetch('./data/market-dashboard.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json());const s=d.market_session||'UNKNOWN';const closed=['AFTER HOURS','PREMARKET','CLOSED'].includes(s);document.getElementById('gate').innerHTML='<b style="font-size:22px">'+(closed?'RESEARCH / REPLAY MODE':'LIVE EXECUTION MODE')+'</b><p class="muted">Session: '+s+'</p><p>'+ (closed?'Market is closed. Signals and feedback are available for study; live 0DTE execution is gated off.':'Market is open. Execution states and contract selection are active. Verify live quotes before trading.')+'</p><p><a href="./dashboard_v2.html">Continue to Command Center</a></p>';if(!closed)setTimeout(()=>location.replace('./dashboard_v2.html'),700)}catch(e){document.getElementById('gate').innerHTML='<b>Dashboard data unavailable</b><p class="muted">'+e.message+'</p><p><a href="./dashboard_v2.html">Open dashboard anyway</a></p>'}}boot();</script></body></html>
