name: Shadow Review Mobile QA
on:
  pull_request:
    paths: ['shadow-review*', 'scripts/test-shadow-mobile.mjs', '.github/workflows/shadow-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-assets.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-shadow-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-mobile-${{ github.run_id }}
          path: test-results/shadow-mobile/
          if-no-files-found: warn
          retention-days: 7
