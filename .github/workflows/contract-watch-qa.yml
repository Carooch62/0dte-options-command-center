name: Contract Watch QA
on:
  pull_request:
    paths:
      - 'contract-watch.js'
      - 'contract-watch.test.js'
      - 'dashboard-clean-app.js'
      - 'dashboard_clean.html'
      - 'scripts/test-contract-watch-ui.mjs'
      - '.github/workflows/contract-watch-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node --test contract-watch.test.js
      - run: node --check dashboard-clean-app.js
      - run: node scripts/test-contract-watch-ui.mjs
