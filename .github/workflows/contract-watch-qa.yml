name: Contract Watch QA
on:
  pull_request:
    paths:
      - 'contract-watch.js'
      - 'trade-exit-assistant.js'
      - 'exit-benchmarks.js'
      - 'contract-watch.test.js'
      - 'watch-*.js'
      - 'worker.js'
      - 'dashboard-clean-app.js'
      - 'dashboard-option-quotes.js'
      - 'quote-poller.js'
      - 'dashboard-position-plans.js'
      - 'position-exits.js'
      - 'scripts/test-dashboard-option-quotes.mjs'
      - 'dashboard_clean.html'
      - 'dashboard_liquid.html'
      - 'index.html'
      - 'dashboard.html'
      - 'scripts/test-contract-watch-ui.mjs'
      - '.github/workflows/contract-watch-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical quote archives are not needed to verify or deploy code.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/*.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node --test contract-watch.test.js watch-discord.test.js watch-monitor.test.js watch-service.test.js
      - run: node --check worker.js
      - run: node --check dashboard-clean-app.js
      - run: node scripts/test-contract-watch-ui.mjs

      - run: node scripts/test-dashboard-option-quotes.mjs
