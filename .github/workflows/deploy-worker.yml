name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
    paths: ['worker.js', 'plaid-sync.js', 'wrangler.toml', 'scripts/build-assets.mjs', '*.html', 'dashboard-*.js', 'dashboard-mobile.css', 'refresh-progress.js', 'trade-review.js', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare browser assets
        run: node scripts/build-assets.mjs
      - name: Deploy Worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
