name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
    paths: ['worker.js', 'wrangler.toml', '*.html', 'dashboard-*.js', 'dashboard-mobile.css', 'refresh-progress.js', 'trade-review.js', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare browser assets
        run: |
          mkdir -p public
          cp index.html dashboard.html dashboard_v2.html dashboard_glass.html dashboard_glass_previous.html dashboard_mobile_preview.html dashboard-mobile.css dashboard-app-previous.js dashboard-app.js dashboard-logic.js refresh-progress.js trade-review.js brokerage.html dashboard-broker.js dashboard-broker-logic.js public/
      - name: Deploy Worker
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
