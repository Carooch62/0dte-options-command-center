name: Staging Algorithm Scan
on:
  push:
    branches: [staging-algorithm]
    paths: ['*.py', '*.js', '*.toml', 'news_event_reviews.json', 'requirements.txt', 'tests/**', '.github/workflows/staging-scan.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: staging-algorithm-scan
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/staging-algorithm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      SCAN_MODE: manual
      SCAN_REQUEST_ID: staging-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-algorithm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      - name: Run combined regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Initialize isolated staging history
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          data=Path('data')
          if not (data/'staging-environment.json').exists():
              shutil.rmtree(data,ignore_errors=True)
              data.mkdir()
              (data/'staging-environment.json').write_text('{"environment":"staging","source":"public research feeds","production_history_imported":false}')
          PY
      - name: Run staging pipeline using public research sources
        run: python pipeline.py
      - name: Publish staging results only
        if: always() && !cancelled()
        run: |
          test "${GITHUB_REF}" = refs/heads/staging-algorithm
          test -f data/staging-environment.json
          git config user.name '0DTE Staging Scanner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update isolated staging scan results'
          git pull --rebase origin staging-algorithm
          git push origin HEAD:staging-algorithm
