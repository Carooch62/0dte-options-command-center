name: Staging Algorithm Scan
on:
  push:
    branches: [staging-next-20261117]
    paths: ['*.py', '*.js', '*.toml', 'news_event_reviews.json', 'requirements.txt', 'tests/**', '.github/workflows/staging-scan.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: staging-next-20261117-scan
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/staging-next-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      SCAN_MODE: manual
      SCAN_REQUEST_ID: staging-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-next-20261117
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/archive/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      - name: Run combined regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Initialize isolated staging history
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          data=Path('data')
          if not (data/'staging-environment.json').exists():
              shutil.rmtree(data,ignore_errors=True)
              data.mkdir()
              (data/'staging-environment.json').write_text('{"environment":"staging","source":"public research feeds","production_history_imported":false}')
          PY
      - name: Run staging pipeline using public research sources
        run: python pipeline.py
      - name: Capture public shadow evidence after a validated scan
        run: |
          python - <<'PY'
          import importlib.util, json, subprocess
          from pathlib import Path
          health=json.loads(Path('data/scan-health.json').read_text())
          if health.get('stage') == 'VALIDATED' and health.get('status') in ('SUCCESS','DEGRADED'):
              from shadow_evidence import capture,compare_news,atomic_json
              from scanner import add_news
              print(json.dumps(capture('data', source_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())))
              snapshot=json.loads(Path('data/market-dashboard.json').read_text())
              probe=compare_news(snapshot,add_news)
              atomic_json(Path('data/news-coverage-probe-latest.json'),probe)
              atomic_json(Path('data/news-coverage-probes')/(snapshot['scan_id']+'.json'),probe)
          else:
              print('No new validated scan; retained evidence keeps its original timestamps.')
          PY
      - name: Publish staging results only
        if: always() && !cancelled()
        run: |
          test "${GITHUB_REF}" = refs/heads/staging-next-20261117
          test -f data/staging-environment.json
          git config user.name '0DTE Staging Scanner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update isolated staging scan results'
          git pull --rebase origin staging-next-20261117
          git push origin HEAD:staging-next-20261117

