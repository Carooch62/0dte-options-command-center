name: IWM prospective control review
on:
  push:
    branches: [staging-next-20261117]
    paths: ['iwm_control_outcomes.py', '.github/workflows/iwm-control-review.yml']
  schedule:
    # After early/regular closes across both DST offsets; source clocks are authoritative.
    - cron: '40 18,20,21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: staging-next-20261117-scan
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging-next-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-next-20261117
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/staging-environment.json
            /data/shadow-evidence/
            /data/iwm-control-outcomes.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare frozen same-session stock bars
        run: python iwm_control_outcomes.py
      - name: Publish isolated comparison only
        run: |
          test "$(git branch --show-current)" = staging-next-20261117
          git config user.name '0DTE Staging Review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse data/iwm-control-outcomes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Compare frozen IWM stock controls without tuning'
          git pull --rebase origin staging-next-20261117
          git push origin HEAD:staging-next-20261117
