name: Patch dashboard refresh button

on:
  push:
    branches:
      - main
    paths:
      - worker.js
      - .github/workflows/patch-refresh-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch refreshNow()
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text()

          old = '''function refreshNow(){
            loadData();
          }'''

          new = '''const REFRESH_URL = "https://0dte-options-command-center.h69htk56cq.workers.dev/refresh";

          async function refreshNow(){
            const button = document.querySelector('button[onclick="refreshNow()"]');
            const original = button ? button.textContent : "↻ Refresh Now";

            if(button){
              button.disabled = true;
              button.textContent = "⏳ Starting scan…";
            }

            document.getElementById("freshnessMessage").innerHTML =
              `<div class="warning">Starting a fresh market scan…</div>`;

            try{
              const response = await fetch(REFRESH_URL, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                mode: "cors",
                cache: "no-store"
              });

              const result = await response.json().catch(() => ({}));

              if(!response.ok || !result.ok){
                throw new Error(result.detail || result.error || `HTTP ${response.status}`);
              }

              document.getElementById("freshnessMessage").innerHTML =
                `<div class="ok">Scan started. Waiting for GitHub Actions to publish the new market data…</div>`;

              const startedAt = Date.now();
              const previousTimestamp =
                marketData?.generated_at || marketData?.timestamp || marketData?.updated_at || null;

              while(Date.now() - startedAt < 120000){
                await new Promise(resolve => setTimeout(resolve, 5000));

                const dataResponse = await fetch(DATA_URL + "?refresh=" + Date.now(), {
                  cache: "no-store"
                });

                if(!dataResponse.ok) continue;

                const data = await dataResponse.json();
                const timestamp = data?.generated_at || data?.timestamp || data?.updated_at || null;

                if(timestamp && timestamp !== previousTimestamp){
                  previousData = marketData;
                  marketData = data;
                  render();
                  document.getElementById("dashboardRefresh").textContent =
                    new Date().toLocaleTimeString();
                  document.getElementById("freshnessMessage").innerHTML =
                    `<div class="ok">✓ Fresh scan loaded: ${escapeHTML(new Date(timestamp).toLocaleTimeString())}</div>`;
                  return;
                }
              }

              await loadData();
              document.getElementById("freshnessMessage").innerHTML =
                `<div class="warning">Scan was started successfully, but the new data has not published yet. GitHub Actions may still be running.</div>`;

            }catch(error){
              document.getElementById("freshnessMessage").innerHTML =
                `<div class="danger">Refresh failed: ${escapeHTML(error.message)}</div>`;
            }finally{
              if(button){
                button.disabled = false;
                button.textContent = original;
              }
            }
          }'''

          if 'const REFRESH_URL = "https://0dte-options-command-center.h69htk56cq.workers.dev/refresh";' in text:
              print("Refresh button already patched")
              raise SystemExit(0)

          if old not in text:
              raise SystemExit("Expected refreshNow() block was not found")

          path.write_text(text.replace(old, new, 1))
          print("Refresh button patched")
          PY

      - name: Commit patch
        run: |
          git config user.name "0DTE Scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix dashboard refresh button"
          git push
