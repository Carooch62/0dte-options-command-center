name: Candidate Mobile QA
on:
  push:
    branches: [release/private-candidate-workflow-20261014]
    paths: ['private-request.js', 'tests/private-request.test.mjs', 'dashboard_glass.html', 'dashboard-app.js', 'dashboard-logic.js', 'dashboard-delivery.js', 'dashboard-mobile.css', 'trade-review.js', 'signal-checklist.js', 'scripts/test-dashboard-qc.mjs', 'connection-ui.css', 'brokerage.html', 'dashboard-broker.js', 'robinhood-connect.js', 'candidate-quotes*', 'quote-evidence.js', 'quote-session.js', 'quote-timing.js', 'tests/quote-timing.test.mjs', 'tests/quote-session.test.mjs', 'tests/validation-setup.test.mjs', 'tests/quote-evidence.test.mjs', 'robinhood-review.js', 'robinhood-live.js', 'private-candidates.js', 'tests/candidate-quotes*', 'tests/private-candidates.test.mjs', 'scripts/test-candidate-mobile.mjs', '.github/workflows/candidate-mobile.yml']
  pull_request:
    paths: ['private-request.js', 'tests/private-request.test.mjs', 'dashboard_glass.html', 'dashboard-app.js', 'dashboard-logic.js', 'dashboard-delivery.js', 'dashboard-mobile.css', 'trade-review.js', 'signal-checklist.js', 'scripts/test-dashboard-qc.mjs', 'connection-ui.css', 'brokerage.html', 'dashboard-broker.js', 'robinhood-connect.js', 'candidate-quotes*', 'quote-evidence.js', 'quote-session.js', 'quote-timing.js', 'tests/quote-timing.test.mjs', 'tests/quote-session.test.mjs', 'tests/validation-setup.test.mjs', 'tests/quote-evidence.test.mjs', 'robinhood-review.js', 'robinhood-live.js', 'private-candidates.js', 'tests/candidate-quotes*', 'tests/private-candidates.test.mjs', 'scripts/test-candidate-mobile.mjs', '.github/workflows/candidate-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser asset bundle
        run: node scripts/build-assets.mjs
      - name: Verify Worker bundle without deploying or using credentials
        run: npx wrangler@4 deploy --dry-run --outdir test-results/worker-dry-run
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      # Match the container and npm package versions; browsers and OS libraries are preinstalled.
      - name: Verify preinstalled Chromium
        timeout-minutes: 2
        run: node -e "const {chromium}=require('playwright'); (async()=>{const browser=await chromium.launch({headless:true}); console.log('Chromium '+browser.version()); await browser.close();})().catch(error=>{console.error(error);process.exit(1);});"
      - name: Run phone-width checks
        run: |
          node scripts/test-candidate-mobile.mjs
          node scripts/test-dashboard-qc.mjs
      - name: Preserve screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-mobile-${{ github.run_id }}
          path: test-results/mobile/
          if-no-files-found: warn
          retention-days: 7



