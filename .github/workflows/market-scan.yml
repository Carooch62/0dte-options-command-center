name: Free Market Scanner

on:
  push:
    paths:
      - "scanner.py"
      - "schema_normalizer.py"
      - "option_expander.py"
      - "tests/**"
      - ".github/workflows/market-scan.yml"
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Scan mode"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - second-wave
  schedule:
    - cron: "*/5 12-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run scanner
        env:
          SCAN_MODE: ${{ github.event.inputs.scan_mode || 'scheduled' }}
        run: python scanner.py
      - name: Expand options pass
        run: python option_expander.py
      - name: Normalize dashboard data
        env:
          SCAN_MODE: ${{ github.event.inputs.scan_mode || 'scheduled' }}
        run: python schema_normalizer.py
      - name: Validate market data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("data/market.json", "data/market-dashboard.json"):
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f"{name} was not created")
              data = json.loads(path.read_text())
              if not isinstance(data, dict):
                  raise SystemExit(f"{name} must contain a JSON object")
              if not isinstance(data.get("candidates"), list):
                  raise SystemExit(f"{name} candidates must be a list")
              if name.endswith("dashboard.json") and data.get("schema_version") != 4:
                  raise SystemExit("dashboard schema version mismatch")
              if name.endswith("market.json") and data.get("option_chain_universe", 0) < min(60, data.get("scanned_rows", 0)):
                  raise SystemExit("options expansion did not reach the configured coverage target")
          print("market data validated")
          PY
      - name: Commit market data
        run: |
          git config user.name "0DTE Scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/market-dashboard.json
          git diff --cached --quiet || git commit -m "Update market scan"
          git push
