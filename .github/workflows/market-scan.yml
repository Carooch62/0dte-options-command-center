name: Free Market Scanner
run-name: "Scan ${{ inputs.request_id || github.run_id }} (${{ inputs.scan_mode || 'scheduled' }})"
on:
  push:
    branches: [main]
    paths: ['*.py', 'requirements.txt', 'tests/**', '.github/workflows/market-scan.yml']
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Scan mode
        default: manual
        type: choice
        options: [manual, second-wave]
      request_id:
        description: Dashboard request ID
        required: false
        type: string
  # Five-minute dispatch is handled by the Cloudflare Worker cron.
  # The scanner still enforces the exchange holiday/session calendar.
permissions:
  contents: write
concurrency:
  group: market-scan
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      SCAN_MODE: ${{ inputs.scan_mode || 'scheduled' }}
      SCAN_REQUEST_ID: ${{ inputs.request_id }}
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.mjs
      - name: Scan, enrich, and validate
        id: scan
        run: python pipeline.py
      - name: Record workflow failure
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('data/scan-health.json')
          try: d=json.loads(p.read_text())
          except Exception: d={}
          if str(d.get('run_id')) != os.environ['RUN_ID']:
              d={'status':'FAILED','stage':'WORKFLOW','error':'Workflow failed before a validated snapshot was produced','run_id':os.environ['RUN_ID'],'request_id':os.getenv('SCAN_REQUEST_ID') or None,'updated_at':datetime.now(timezone.utc).isoformat()}
              p.parent.mkdir(exist_ok=True);p.write_text(json.dumps(d))
          PY
      - name: Publish validated data or failure health
        if: always() && !cancelled()
        run: |
          git config user.name '0DTE Scanner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update validated scan and health'
          git pull --rebase origin main
          git push origin HEAD:main
